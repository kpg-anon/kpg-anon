name: update profile card

on:
  schedule:
    # 05:27 UTC daily. An off-the-hour minute avoids the queue at :00.
    - cron: "27 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - generate.py
      - requirements.txt
      - .github/workflows/update-card.yml

permissions:
  contents: write

concurrency:
  group: update-profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate cards
        env:
          # PROFILE_TOKEN is optional. The built-in GITHUB_TOKEN can read all
          # the public data this needs; set a PAT only if the query ever wants
          # something scoped beyond it.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate.py --user "${{ github.repository_owner }}"

      - name: Commit if the cards changed
        run: |
          git config user.name "kpg-anon"
          git config user.email "128227694+kpg-anon@users.noreply.github.com"
          if git diff --quiet -- dark_mode.svg light_mode.svg; then
            echo "cards unchanged, nothing to commit"
          else
            git add dark_mode.svg light_mode.svg
            git commit -m "refresh profile card"
            # Rebase first: a manual dispatch can race the scheduled run.
            git pull --rebase --autostash origin main
            git push
          fi
